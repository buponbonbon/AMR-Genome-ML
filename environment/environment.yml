name: amr-genome-ml

channels:
  - conda-forge
  - bioconda

channel_priority: strict

dependencies:
  - python=3.13
  - pip

  # Core scientific Python
  - numpy
  - pandas
  - scipy
  - scikit-learn
  - pyarrow
  - psutil

  # Notebook support
  - jupyterlab
  - ipykernel

  # Sequence-variation toolchain
  - unitig-caller=1.3.2
  - bifrost=1.3.5